# The daily smoke test (plan.md item 2): tests/e2e/smoke.spec.ts against production, once a day
# and on demand, through the judging window. It makes no live Qloo build. Its one secret,
# HEALTH_TOKEN, is optional: with it, the deep health check also makes one Qloo search and one
# one-token Claude call a day.
# A failed scheduled run emails whoever last changed this schedule (GitHub's default for
# scheduled workflows) and opens an issue, so a failure is seen.
name: smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    # This repository only: Monday's public copy must never run it against production.
    if: github.repository == 'danielbutnar/undercard'
    # Pinned until judging ends: GitHub moves ubuntu-latest to Ubuntu 26 from 19 October, which
    # may be what broke the 23 October morning run's Playwright install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Once more on failure: the scheduled run of 2026-10-23 (11:34 UTC) died here (apt, exit
      # code 100) before any test ran.
      - run: pnpm exec playwright install --with-deps chromium || (sleep 30 && pnpm exec playwright install --with-deps chromium)
      - name: Smoke test against production
        id: smoke
        run: pnpm e2e tests/e2e/smoke.spec.ts --workers=1
        env:
          E2E_BASE_URL: https://undercard-daniel-51ed.vercel.app
      # GET /api/health/deep once (src/server/health.ts): one Qloo search and one one-token Claude
      # call. It runs even when the smoke test failed, and fails the run unless both answer ok;
      # without the HEALTH_TOKEN secret, or once today's checks are used (429), it passes with a
      # notice.
      - name: Deep health check
        if: ${{ !cancelled() }}
        run: node scripts/deep-health.mjs
        env:
          E2E_BASE_URL: https://undercard-daniel-51ed.vercel.app
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
      # Only when the smoke test step itself failed, not a failed install or deep check.
      - name: Open an issue when the smoke test fails
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Smoke test failed on ${new Date().toISOString().slice(0, 10)}`,
              body: `The daily smoke test against production failed: ${run}`,
            });
