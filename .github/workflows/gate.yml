# pnpm gate (typecheck, lint, every unit test and the design-ban scan) on every push to main
# and on pull requests. It needs no secrets: the unit tests run against synthetic Qloo and
# model fakes, and the live Upstash check skips without its variable.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
